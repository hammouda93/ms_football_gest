name: Elite pricing v350 isolated regression

on:
  push:
    branches: [fix/elite-athletes-pricing-v350]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  elite-pricing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: ms_football_gest.test_settings
      DJANGO_SECRET_KEY: ci-isolated-not-for-production-12345678
      MSF_ACTIONS_PILOT_CONFIG: '{"enabled":false,"credentials":{}}'
      MSF_ACTIONS_EXECUTE_ENABLED: "false"
      MSF_DATA_ACCESS_ENABLED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10.22'
      - name: Browser pricing regression
        run: node actions/test_elite_pricing_js.cjs
      - name: Install repository dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Django system check
        run: python manage.py check --settings=ms_football_gest.test_settings
      - name: Pricing and Hermes regression
        run: python manage.py test actions.test_elite_pricing gestion_joueurs.tests.VideoAcademyOrderTests actions.test_player_contracts actions.test_video_contracts actions.test_highlight_payment_contracts sportsbase_data.test_youtube_progress_recovery sportsbase_data.test_youtube_transfer_gate sportsbase_data.test_local_agent_config --settings=ms_football_gest.test_settings --verbosity 2
