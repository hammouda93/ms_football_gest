name: Hermes video Highlights payment contract qualification

on:
  push:
    branches: [feat/hermes-highlight-payments-20261111]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  highlight-payment-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: ms_football_gest.test_settings
      DJANGO_SECRET_KEY: ci-isolated-not-for-production-12345678
      MSF_ACTIONS_PILOT_CONFIG: '{"enabled":false,"credentials":{}}'
      MSF_ACTIONS_EXECUTE_ENABLED: "false"
      MSF_DATA_ACCESS_ENABLED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10.22'
      - name: Install repository dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip check
      - name: Django system check
        run: python manage.py check --settings=ms_football_gest.test_settings
      - name: Validate complete Hermes catalogue
        run: |
          python manage.py shell --settings=ms_football_gest.test_settings -c "from actions.registry import catalogue; from actions.mount import APPROVED_OPERATIONS; assert set(catalogue()) == APPROVED_OPERATIONS; print('Catalogue:',len(APPROVED_OPERATIONS))"
      - name: Joueurs, Vidéos and Highlights payments regression
        run: python manage.py test actions.test_player_contracts actions.test_video_contracts actions.test_highlight_payment_contracts --settings=ms_football_gest.test_settings --verbosity 2
