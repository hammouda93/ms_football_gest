name: Hermes player contracts isolated qualification

on:
  push:
    branches:
      - feat/hermes-player-parity-20261111
    paths:
      - "actions/**"
      - "gestion_joueurs/**"
      - "client_portal/**"
      - "ms_football_gest/**"
      - "requirements.txt"
      - ".github/workflows/hermes-player-parity.yml"

permissions:
  contents: read

jobs:
  player-contracts:
    name: Django player contract tests (disposable SQLite)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: ms_football_gest.test_settings
      DJANGO_SECRET_KEY: ci-isolated-not-for-production-12345678
      MSF_ACTIONS_PILOT_CONFIG: '{"enabled":false,"credentials":{}}'
      MSF_ACTIONS_EXECUTE_ENABLED: "false"
      MSF_DATA_ACCESS_ENABLED: "0"
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10.22"
          cache: pip
      - name: Install project dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip check
      - name: Django system checks
        run: python manage.py check --settings=ms_football_gest.test_settings
      - name: Validate native writer allowlist / registry equality
        run: |
          python manage.py shell --settings=ms_football_gest.test_settings -c "from actions.registry import catalogue; from actions.mount import APPROVED_OPERATIONS; assert set(catalogue()) == APPROVED_OPERATIONS; print('Native writer catalogue: matched', len(APPROVED_OPERATIONS))"
      - name: Run player parity regression tests
        run: python manage.py test actions.test_player_contracts --settings=ms_football_gest.test_settings --verbosity 2
