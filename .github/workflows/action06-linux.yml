name: extension24 delta only

on:
  push:
    branches: [ci/hermes-extension24-linux-20261102t222522z]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Python 3.10.22 / Django 4.2.20 / PostgreSQL 16.14
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_DB: msf_ext24_fiction
          POSTGRES_USER: msf_ext24_fixture
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:55951:5432
        options: >-
          --health-cmd "pg_isready -U msf_ext24_fixture -d msf_ext24_fiction"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        shell: bash
        working-directory: qualification/ext24
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /qualification/ext24/
            /.github/workflows/action06-linux.yml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10.22'
      - run: python -s -B verify_ci_inventory.py
      - name: Install isolated fixture dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
          .venv/bin/python -m pip check
      - name: Attest disposable PostgreSQL target
        env:
          CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker inspect "$CONTAINER" --format '{{json .NetworkSettings.Networks}}' > networks.json
          python -c 'import json,pathlib; n=json.loads(pathlib.Path("networks.json").read_text()); ips=[v["IPAddress"] for v in n.values()]; assert len(ips)==1; pathlib.Path("ci-target.json").write_text(json.dumps({"serverAddress":ips[0],"serverPort":5432,"dataDirectory":"/var/lib/postgresql/data"}))'
      - name: offline exact extension24 fixture
        run: .venv/bin/python -s -B ci_delta_job.py offline 2>&1 | tee offline.log
      - name: migrate exact extension24 fixture
        run: .venv/bin/python -s -B ci_delta_job.py migrate 2>&1 | tee migrate.log
      - name: tests exact extension24 fixture
        run: .venv/bin/python -s -B ci_delta_job.py tests 2>&1 | tee tests.log
      - name: Real fixture socket and unchanged plugin transport
        run: .venv/bin/python -s -B ci_socket_smoke.py | tee socket-result.json
      - name: readback exact extension24 fixture
        run: .venv/bin/python -s -B ci_delta_job.py readback 2>&1 | tee readback.log
      - run: python -s -B verify_ci_inventory.py
      - name: Retain bounded machine evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: extension24-linux-machine
          retention-days: 1
          if-no-files-found: error
          path: |
            qualification/ext24/delta-result.json
            qualification/ext24/offline.log
            qualification/ext24/migrate.log
            qualification/ext24/tests.log
            qualification/ext24/readback.log
            qualification/ext24/socket-result.json
            qualification/ext24/socket.log
            qualification/ext24/ci-target.json
