name: Highlights isolated server qualification

on:
  push:
    branches: [feat/bridge-highlights-linux-20261111]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Python 3.10.22 / Django 4.2.20 / PostgreSQL 16.14
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_DB: msf_highlights_fiction
          POSTGRES_USER: msf_highlights_fixture
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:55961:5432
        options: >-
          --health-cmd "pg_isready -U msf_highlights_fixture -d msf_highlights_fiction"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        shell: bash
        working-directory: qualification/highlights
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /qualification/highlights/
            /.github/workflows/action06-linux.yml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10.22'
      - run: python -s -B verify_ci_inventory.py
      - name: Install isolated fixture dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
          .venv/bin/python -m pip check
      - name: Attest disposable PostgreSQL target
        env:
          CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker inspect "$CONTAINER" --format '{{json .NetworkSettings.Networks}}' > networks.json
          python -c 'import json,pathlib; n=json.loads(pathlib.Path("networks.json").read_text()); ips=[v["IPAddress"] for v in n.values()]; assert len(ips)==1; pathlib.Path("ci-target.json").write_text(json.dumps({"serverAddress":ips[0],"serverPort":5432,"dataDirectory":"/var/lib/postgresql/data"}))'
      - name: offline exact Highlights fixture
        run: .venv/bin/python -s -B ci_highlights_job.py offline 2>&1 | tee offline.log
      - name: migrate exact Highlights fixture
        run: .venv/bin/python -s -B ci_highlights_job.py migrate 2>&1 | tee migrate.log
      - name: tests exact Highlights fixture
        run: .venv/bin/python -s -B ci_highlights_job.py tests 2>&1 | tee tests.log
      - name: readback exact Highlights fixture
        run: .venv/bin/python -s -B ci_highlights_job.py readback 2>&1 | tee readback.log
      - run: python -s -B verify_ci_inventory.py
