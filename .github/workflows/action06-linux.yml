name: action06 Linux qualification

on:
  push:
    branches: [ci/hermes-actions-linux-20261028]

permissions:
  contents: read

jobs:
  qualify:
    name: Python 3.10.22 / Django 4.2.20 / PostgreSQL 16.14
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_DB: msf_action03_fiction
          POSTGRES_USER: msf_action01_fixture_owner
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:55440:5432
        options: >-
          --health-cmd "pg_isready -U msf_action01_fixture_owner -d msf_action03_fiction"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        shell: bash
        working-directory: qualification/action06
    steps:
      - name: Checkout explicit qualification tree only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /qualification/action06/
            /qualification/action-pilot-prepare/
            /.github/workflows/action06-linux.yml
      - name: Exact official Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10.22'
          architecture: x64
          check-latest: false
      - name: Verify reviewed sources
        run: python -s -B verify_sources.py
      - name: Install isolated pinned harness dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
          .venv/bin/python -m pip check
      - name: Attest disposable service address and image
        env:
          CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker inspect "$CI_POSTGRES_CONTAINER" --format '{{json .NetworkSettings.Networks}}' > ci-networks.json
          docker inspect "$CI_POSTGRES_CONTAINER" --format '{{.Config.Image}}'
          python -s -B -c 'import json,pathlib; p=pathlib.Path("ci-networks.json"); networks=json.loads(p.read_text()); ips=[n["IPAddress"] for n in networks.values()]; assert len(ips)==1; pathlib.Path("ci-target.json").write_text(json.dumps({"serverAddress":ips[0]}))'
      - name: Migrate fresh fictional database under isolation guards
        run: .venv/bin/python -s -B ../action-pilot-prepare/ci_worker.py migrate
      - name: Replay only affected suites and new prepare-only tests
        run: .venv/bin/python -s -B ../action-pilot-prepare/ci_worker.py
      - name: Build and verify preview-only package without upload
        run: .venv/bin/python -s -B ../action-pilot-prepare/ci_preview.py
